<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AIUX</title>
    <link rel="stylesheet" href="../shared/devtools.css">
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="components">Components</button>
      <button class="tab" role="tab" data-tab="events">Events <span id="events-badge" class="tab-badge hidden"></span></button>
    </nav>

    <section id="tab-components" class="tab-page">
      <div class="toolbar">
        <button id="pick" title="Select a component in the page to inspect it">⬚ Pick</button>
        <button id="refresh" title="Rebuild the component tree">⟳</button>
        <input id="filter" type="search" placeholder="Filter components (tag, id, React name)…">
        <label title="Poll the page for changes"><input id="live" type="checkbox"> Live</label>
        <button id="settings-toggle" title="Settings">⚙</button>
        <span id="status" class="status"></span>
      </div>

      <form id="settings" class="settings hidden">
        <label>
          Component tag pattern (RegExp) — AIUX elements are always included, whatever their tag
          <input id="tagPattern" type="text" spellcheck="false">
        </label>
        <label class="check"><input id="allCustomElements" type="checkbox"> Show every custom element (ignore pattern)</label>
        <label class="check"><input id="includeReact" type="checkbox"> Detect React components (props &amp; hooks)</label>
        <label>
          Extra state paths on the host element (non-Lit components), one per line — e.g. <code>__myFramework.state</code> or <code>store.getState()</code>
          <textarea id="statePaths" rows="3" spellcheck="false"></textarea>
        </label>
        <div class="settings-actions">
          <button type="button" id="settings-reset">Reset to defaults</button>
          <button type="submit">Apply</button>
        </div>
      </form>

      <div class="main">
        <div id="tree" class="tree" tabindex="0"></div>
        <div id="splitter" class="splitter"></div>
        <div id="details" class="details"></div>
      </div>
    </section>

    <section id="tab-events" class="tab-page hidden">
      <div class="toolbar">
        <button id="ev-record" title="Record events dispatched in the page">● Record</button>
        <button id="ev-reload" title="Reload the page and record from the first script">↻ Reload &amp; record</button>
        <button id="ev-clear" title="Clear the log">⊘ Clear</button>
        <input id="ev-filter" type="search" placeholder="Filter by event or component (use -text to exclude)…">
        <select id="ev-mode" title="Which dispatched events to record">
          <option value="components">Component events</option>
          <option value="all">All dispatched events</option>
        </select>
        <label title="Keep the log when the page navigates"><input id="ev-preserve" type="checkbox"> Preserve log</label>
        <span id="ev-status" class="status"></span>
      </div>
      <div class="main">
        <div class="event-log">
          <div class="event-head event-row">
            <span class="c-time">Time</span><span class="c-type">Event</span><span class="c-src">Source</span><span class="c-detail">Detail</span>
          </div>
          <div id="ev-list" class="event-list" tabindex="0"></div>
        </div>
        <div id="ev-splitter" class="splitter"></div>
        <div id="ev-details" class="details"></div>
      </div>
    </section>

    <script src="../shared/theme.js"></script>
    <script src="../shared/bridge.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="../shared/details.js"></script>
    <script src="panel.js"></script>
    <script src="events.js"></script>
  </body>
</html>
