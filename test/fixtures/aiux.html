<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AIUX DevTools — AIUX demo</title>
    <script src="listener-tracker.js"></script>
    <script type="importmap">
      {
        "imports": {
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; }
      aiux-checklist, content-toolbar { display: block; border: 1px solid #ccc; border-radius: 6px; padding: 8px; margin: 8px 0; }
    </style>
  </head>
  <body>
    <!--
      A stand-in for an AIUX page, used by the tests and `npm run demo`
      (harness.html?page=aiux). Components are real Lit (production build)
      elements on a small AIUXElement look-alike that mirrors the public
      surface of @servicenow/aiux's base class: Lit properties + @state,
      symbol-keyed `data`, @config fields recorded in `configSchema`, a
      reactive controller holding UI state,
      `static capabilities`, setLoaderData()/trackEvent(), and CustomEvents
      dispatched from the host with bubbles + composed.
    -->
    <h3>AIUX demo</h3>
    <content-toolbar></content-toolbar>
    <aiux-checklist id="list" header-title="Resolution steps"
      checklist-data='[{"id":"1","label":"Reproduce the issue"},{"id":"2","label":"Restart the mail service"}]'></aiux-checklist>

    <script type="module">
      import { LitElement, html } from 'lit';

      const dataProp = Symbol('aiuxData');
      const loaderData = new WeakMap();

      class AIUXElement extends LitElement {
        static properties = {
          'layout-key': { type: String, reflect: true },
          aiuxConfigData: { type: Object, attribute: 'aiux-config-data' },
          _islandActivated: { state: true },
          [dataProp]: { type: Object, attribute: false }
        };
        constructor() {
          super();
          this._islandActivated = true;
        }
        get data() { return this[dataProp]; }
        set data(v) { this[dataProp] = v; }
        get loaderData() { return loaderData.get(this); }
        get serverScriptData() { return undefined; }
        get loaderScopeKey() { return 'default'; }
        get isEmbedded() { return false; }
        setLoaderData(d) { loaderData.set(this, d); this.requestUpdate(); }
        trackEvent() {}
      }

      // Same shape as AIUX's @config: schema on the prototype, value read from aiuxConfigData.
      function config(proto, key, opts) {
        if (!Object.prototype.hasOwnProperty.call(proto, 'configSchema')) proto.configSchema = [];
        proto.configSchema.push({ key, ...opts });
        Object.defineProperty(proto, key, {
          set() {},
          get() {
            const v = this.aiuxConfigData?.[key];
            return v === undefined ? opts.default : v;
          }
        });
      }

      // Controllers named the way a minifier leaves them on a real instance
      // (class names shortened, property names intact).
      class eg { // @lit/localize's controller: registered, but held by no field
        constructor(host) {
          this.host = host;
          this.__litLocalizeEventHandler = () => {};
          host.addController(this);
        }
        hostConnected() {}
      }
      class ez { // registered, held by no field, no recognisable shape
        constructor(host) {
          this._entries = [];
          this._rafId = 0;
          host.addController(this);
        }
        hostUpdated() {}
      }
      class o { // held by another controller, not by the host
        constructor(host) {
          this._live = null;
          host.addController(this);
        }
      }
      class E { // held by a host field
        constructor(host) {
          this.open = false;
          host.addController(this);
        }
        hostConnected() {}
      }

      // Like real AIUX components, UI state lives in a Lit reactive controller.
      class ChecklistController {
        constructor(host) {
          this.host = host;
          this.addItemValue = '';
          this.menuOpen = false;
          this.toggleMenu = () => {
            this.menuOpen = !this.menuOpen;
            this.host.requestUpdate();
          };
          host.addController(this);
        }
        hostConnected() {}
      }

      class AIUXChecklist extends AIUXElement {
        static properties = {
          checklistData: { type: Array, attribute: 'checklist-data' },
          headerTitle: { type: String, attribute: 'header-title' },
          _activeIndex: { state: true },
          _draft: { state: true }
        };
        static capabilities = { addItem: { handler: 'addItem' } };
        constructor() {
          super();
          this.checklistData = [];
          this.headerTitle = '';
          this._activeIndex = -1;
          this._draft = '';
          new eg(this);
          new ez(this);
          this._ctrl = new ChecklistController(this);
          this._ctrl._announcer = new o(this);
          this.addEventListener('keydown', this._onKeyDown);
        }
        _onKeyDown() {}
        addItem(label) {
          this.checklistData = [...this.checklistData, { id: String(this.checklistData.length + 1), label }];
        }
        firstUpdated() {
          this.dispatchEvent(new CustomEvent('aiux-checklist:ready', { detail: { count: this.checklistData.length }, bubbles: true, composed: true }));
        }
        _click(item, index) {
          this._activeIndex = index;
          this.dispatchEvent(new CustomEvent('aiux-checklist:item-clicked', { detail: { item, index }, bubbles: true, composed: true }));
        }
        render() {
          return html`
            <h4>${this.headerTitle} <small>(${this.configSize})</small></h4>
            ${this._ctrl.menuOpen ? html`<div class="menu">Edit all · Delete all</div>` : ''}
            ${this._ctrl.addItemValue ? html`<div class="draft">draft: ${this._ctrl.addItemValue}</div>` : ''}
            <ul>${this.checklistData.map((item, i) => html`
              <li class=${i === this._activeIndex ? 'active' : ''} @click=${() => this._click(item, i)}>
                ${i === this._activeIndex ? '▶ ' : ''}${item.label}
              </li>`)}
            </ul>`;
        }
      }
      config(AIUXChecklist.prototype, 'configSize', { label: 'Size', type: String, default: 'md' });

      // An AIUX element whose tag doesn't match the default tag pattern.
      class ContentToolbar extends AIUXElement {
        static properties = { items: { type: Array } };
        constructor() {
          super();
          this.items = ['Save', 'Assign'];
          this._menu = new E(this);
        }
        render() {
          return html`${this.items.map((label) => html`<button @click=${() => this.dispatchEvent(new CustomEvent('content-toolbar:action', { detail: { label }, bubbles: true, composed: true }))}>${label}</button> `)}`;
        }
      }

      customElements.define('aiux-checklist', AIUXChecklist);
      customElements.define('content-toolbar', ContentToolbar);
      document.getElementById('list').data = { incident: 'INC0010023' };
      window.dispatchEvent(new CustomEvent('aiux:app-ready', { detail: { components: 2 } }));
    </script>
  </body>
</html>
